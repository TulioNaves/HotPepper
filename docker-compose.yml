services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hotpepper-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - APP_URL=http://localhost:8000
      # Força o uso do SQLite e ignora qualquer configuração errada do Rafa
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/app/backend/database/database.sqlite
    volumes:
      - ./backend:/app
    # O comando mágico atualizado sem o cp (cópia) do .env antigo:
    command:
      [
        "sh",
        "-c",
        "cd backend && composer install && mkdir -p database && touch database/database.sqlite && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000",
      ]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hotpepper-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    command:
      ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]
